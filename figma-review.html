<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피그마 검수 — MA Overview 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e2e8f0;
    --border2: #f1f5f9;
    --text: #0f172a;
    --text2: #334155;
    --text3: #64748b;
    --text4: #94a3b8;
    --text5: #cbd5e1;
    --accent: #6366f1;
    --accent-bg: #eef2ff;
    --header-bg: #0f172a;
    --header-text: #f8fafc;
    --green: #16a34a; --green-bg: #f0fdf4; --green-acc: #22c55e;
    --red: #dc2626;   --red-bg: #fef2f2;   --red-acc: #ef4444;
    --purple: #9333ea; --purple-bg: #faf5ff; --purple-acc: #a855f7;
    --yellow-bg: #fffbeb; --yellow-border: #fde68a; --yellow-text: #92400e; --yellow-sub: #b45309;
    --radius: 10px; --radius-sm: 6px;
    --font: 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #0f172a;
      --border: #334155; --border2: #1e293b;
      --text: #f1f5f9; --text2: #cbd5e1; --text3: #94a3b8; --text4: #64748b; --text5: #475569;
      --header-bg: #020617; --header-text: #f8fafc;
      --green-bg: #052e16; --red-bg: #450a0a; --purple-bg: #3b0764;
      --yellow-bg: #1c1403; --yellow-border: #713f12;
    }
  }

  html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

  /* ── 레이아웃 ── */
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  .view { display: none; flex-direction: column; min-height: 100vh; }
  .view.active { display: flex; }

  /* ── 헤더 ── */
  .topbar {
    background: var(--header-bg); color: var(--header-text);
    padding: 14px 20px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.3);
  }
  .topbar-inner { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .breadcrumb { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
  .breadcrumb span { font-size: 11px; color: #475569; cursor: default; }
  .breadcrumb .bc-sep { color: #334155; }
  .breadcrumb .bc-link { color: #818cf8; cursor: pointer; }
  .breadcrumb .bc-link:hover { text-decoration: underline; }
  .topbar-title { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 3px; }
  .topbar-sub { font-size: 11px; color: #64748b; }
  .figma-link { font-size: 11px; color: #6366f1; text-decoration: none; }
  .figma-link:hover { text-decoration: underline; }
  .prog-box { display: flex; align-items: center; gap: 10px; }
  .prog-circle { position: relative; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .prog-num { position: absolute; font-size: 11px; font-weight: 700; color: var(--header-text); }
  .prog-stats { display: flex; flex-direction: column; gap: 3px; }
  .pill { font-size: 10px; font-weight: 600; border-radius: 4px; padding: 2px 7px; display: inline-block; }
  .pill-g { background: #f0fdf4; color: #16a34a; }
  .pill-r { background: #fef2f2; color: #dc2626; }
  .pill-n { background: #1e293b; color: #94a3b8; }
  .flow-bar { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding-bottom: 1px; }
  .flow-bar::-webkit-scrollbar { display: none; }
  .fc { font-size: 10px; color: #94a3b8; white-space: nowrap; background: #1e293b; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
  .fa { font-size: 10px; color: #475569; flex-shrink: 0; white-space: nowrap; }
  .fdot { width: 5px; height: 5px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }

  /* ── 메인 컨텐츠 ── */
  .content { flex: 1; padding: 14px 16px; max-width: 720px; width: 100%; margin: 0 auto; }

  /* ── 인덱스 ── */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .stat-val { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .stat-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .progress-wrap { margin-bottom: 20px; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 5px; }
  .progress-track { height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--text3); border-radius: 99px; transition: width 0.4s; }
  .section-label { font-size: 10px; font-weight: 700; color: var(--text4); text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 6px; }
  .section-label:first-of-type { margin-top: 0; }
  .idx-cards { display: flex; flex-direction: column; gap: 4px; }
  .idx-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
  .idx-card:hover:not(.idx-disabled) { border-color: var(--accent); background: var(--accent-bg); }
  .idx-card.idx-disabled { opacity: 0.4; cursor: default; }
  .idx-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-wip { background: #f59e0b; }
  .dot-todo { background: var(--border); }
  .idx-body { flex: 1; min-width: 0; }
  .idx-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .idx-note { font-size: 11px; color: var(--text3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .idx-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .ibadge { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .ibadge-wip { background: #fef3c7; color: #92400e; }
  .ibadge-todo { background: var(--surface2); color: var(--text4); }
  .ibadge-done { background: #f0fdf4; color: #166534; }
  .ibadge-issue { background: #fef2f2; color: #991b1b; }
  .idx-arrow { font-size: 12px; color: var(--text4); }
  .idx-num { font-size: 11px; color: var(--text4); min-width: 28px; font-variant-numeric: tabular-nums; }
  .divider { height: 0.5px; background: var(--border); margin: 16px 0; }

  /* ── 체크리스트 페이지 ── */
  .grp-header { background: #1e293b; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 6px; }
  .grp-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .grp-title { font-size: 13px; font-weight: 700; color: #f1f5f9; }
  .grp-flink { font-size: 11px; color: #6366f1; text-decoration: none; }
  .grp-flink:hover { text-decoration: underline; }
  .grp-desc { font-size: 11px; color: #64748b; line-height: 1.5; }
  .grp-wrap { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }

  .case-card { border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
  .case-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 0; gap: 8px; flex-wrap: wrap; }
  .case-toggle { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; text-align: left; flex: 1; min-width: 0; font-family: var(--font); }
  .case-num { font-size: 10px; font-weight: 700; color: var(--text5); min-width: 20px; }
  .case-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .case-badge { font-size: 9px; font-weight: 600; background: #e0e7ff; color: #4338ca; border-radius: 3px; padding: 1px 5px; }
  .chevron { font-size: 12px; color: var(--text4); transition: transform 0.2s; flex-shrink: 0; }
  .status-btns { display: flex; align-items: center; gap: 3px; }
  .st-btn { width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: all 0.12s; font-family: var(--font); }
  .figma-btn { width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text4); text-decoration: none; background: transparent; }
  .figma-btn:hover { border-color: var(--accent); color: var(--accent); }
  .status-lbl { font-size: 10px; font-weight: 600; padding: 2px 14px 8px; letter-spacing: 0.02em; }

  .case-body { padding: 0 14px 12px; border-top: 1px solid var(--border2); padding-top: 10px; display: flex; flex-direction: column; gap: 9px; }
  .sec-title { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 0.07em; text-transform: uppercase; }
  .flow-text { font-size: 12px; color: var(--text2); background: var(--surface2); border-radius: 5px; padding: 7px 10px; line-height: 1.65; }
  .comp-list { list-style: none; display: flex; flex-direction: column; }
  .comp-item { font-size: 11.5px; line-height: 1.75; display: flex; align-items: flex-start; }
  .comp-item .bullet { color: var(--text5); margin-right: 4px; flex-shrink: 0; font-size: 10px; padding-top: 2px; }

  .edge-card { background: var(--yellow-bg); border: 1px solid var(--yellow-border); border-radius: 6px; padding: 8px 10px; margin-bottom: 4px; }
  .edge-label { font-size: 11.5px; font-weight: 700; color: var(--yellow-text); margin-bottom: 3px; }
  .edge-note { font-size: 10.5px; color: var(--yellow-sub); font-style: italic; line-height: 1.5; margin-bottom: 5px; }

  .memo-box { cursor: pointer; background: var(--surface2); border-radius: 5px; padding: 7px 10px; display: flex; align-items: flex-start; gap: 5px; border: 1px dashed var(--border); min-height: 30px; }
  .memo-box:hover { border-color: var(--text4); }
  .memo-placeholder { font-size: 11px; color: var(--text5); font-style: italic; }
  .memo-content { font-size: 11.5px; color: var(--text2); line-height: 1.6; white-space: pre-wrap; }

  .edit-wrap { display: flex; flex-direction: column; gap: 5px; }
  textarea { width: 100%; border: 1.5px solid var(--accent); border-radius: 5px; padding: 7px 9px; font-size: 11.5px; color: var(--text); background: var(--surface); resize: vertical; outline: none; font-family: var(--font); line-height: 1.6; }
  .edit-btns { display: flex; gap: 5px; }
  .save-btn { background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: 4px 12px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: var(--font); }
  .save-btn:hover { opacity: 0.9; }
  .cancel-btn { background: none; color: var(--text4); border: 1px solid var(--border); border-radius: 4px; padding: 4px 9px; font-size: 11px; cursor: pointer; font-family: var(--font); }

  footer { text-align: center; padding: 10px 20px; font-size: 11px; color: var(--text4); border-top: 0.5px solid var(--border); background: var(--surface); display: flex; justify-content: space-between; align-items: center; }
  .reset-btn { background: none; border: 1px solid #fca5a5; color: #ef4444; border-radius: 4px; padding: 2px 8px; font-size: 10px; cursor: pointer; font-family: var(--font); }
  .reset-btn:hover { background: #fef2f2; }











  /* ── 필터 바 ── */
  .filter-bar { display:flex; gap:6px; flex-wrap:wrap; padding:10px 16px 4px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  .filter-chip { border:1.5px solid var(--border); background:none; color:var(--text3); border-radius:20px; padding:3px 12px; font-size:11px; font-weight:600; cursor:pointer; font-family:var(--font); transition:all 0.12s; white-space:nowrap; }
  .filter-chip:hover { border-color:var(--accent); color:var(--accent); }
  .filter-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .filter-chip.chip-checked { background:#22c55e; border-color:#22c55e; color:#fff; }
  .filter-chip.chip-issue  { background:#ef4444; border-color:#ef4444; color:#fff; }
  .filter-chip.chip-skip   { background:#f59e0b; border-color:#f59e0b; color:#fff; }
  .filter-chip.chip-na     { background:#8b5cf6; border-color:#8b5cf6; color:#fff; }
  .filter-chip.chip-untouched { background:var(--surface2); border-color:var(--border); color:var(--text3); }
  .filter-result-count { font-size:10px; color:var(--text4); align-self:center; margin-left:auto; white-space:nowrap; }
  .case-card.hidden { display:none; }
  .grp-wrap.all-hidden { display:none; }

  @media (max-width: 480px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .topbar { padding: 12px 14px; }
    .content { padding: 12px 12px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ══ 인덱스 뷰 ══════════════════════════════════════════════════════ -->
  <div class="view active" id="view-index">
    <div class="topbar">
      <div class="topbar-inner">
        <div>
          <div class="topbar-title">피그마 검수</div>
          <div class="topbar-sub">MA — Overview 2026 · 실제 구현 대조 체크리스트</div>
        </div>
        <div class="prog-box">
          <div class="prog-circle">
            <svg width="52" height="52" viewBox="0 0 52 52">
              <circle cx="26" cy="26" r="21" fill="none" stroke="#1e293b" stroke-width="4"/>
              <circle id="idx-prog-circle" cx="26" cy="26" r="21" fill="none" stroke="#6366f1" stroke-width="4"
                stroke-dasharray="131.9" stroke-dashoffset="131.9" stroke-linecap="round" transform="rotate(-90 26 26)"
                style="transition:stroke-dashoffset 0.4s"/>
            </svg>
            <span class="prog-num" id="idx-prog-num">0%</span>
          </div>
          <div class="prog-stats">
            <span class="pill pill-g" id="idx-stat-done">✓ 0 완료</span>
            <span class="pill pill-r" id="idx-stat-issue">! 0 이슈</span>
            <span class="pill pill-n" id="idx-stat-total">총 0개</span>
          </div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="progress-wrap">
        <div class="progress-labels"><span>전체 진행률</span><span id="idx-prog-pct">0%</span></div>
        <div class="progress-track"><div class="progress-fill" id="idx-prog-bar" style="width:0%"></div></div>
      </div>
      <div id="idx-body"></div>
    </div>
    <footer>
      <span id="idx-footer-text">피그마 검수 체크리스트</span>
      <span style="font-size:10px;color:var(--text4)">MA Overview 2026</span>
    </footer>
  </div>

  <!-- ══ 체크리스트 뷰 (동적 렌더) ════════════════════════════════════ -->
  <div class="view" id="view-checklist">
    <div class="topbar" id="cl-topbar"></div>
    <div class="filter-bar" id="cl-filter-bar" style="display:none">
      <button class="filter-chip active" data-filter="all" onclick="applyFilter('all')">전체</button>
      <button class="filter-chip chip-untouched" data-filter="untouched" onclick="applyFilter('untouched')">⬜ 미확인</button>
      <button class="filter-chip chip-checked" data-filter="checked" onclick="applyFilter('checked')">✓ 완료</button>
      <button class="filter-chip chip-issue" data-filter="issue" onclick="applyFilter('issue')">! 이슈</button>
      <button class="filter-chip chip-skip" data-filter="skip" onclick="applyFilter('skip')">— 스킵</button>
      <button class="filter-chip chip-na" data-filter="na" onclick="applyFilter('na')">N/A</button>
      <span class="filter-result-count" id="cl-filter-count"></span>
    </div>
    <div class="content" id="cl-content"></div>
    <footer>
      <span id="cl-footer"></span>
    </footer>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════════════════════
const FIGMA_FILE_KEY = "cENAiJHjFqKkZYNPBSSE1y";
const toUrl = id => `https://www.figma.com/design/${FIGMA_FILE_KEY}?node-id=${id.replace(":", "-")}`;

const STATUS_LIST = [
  { key:"untouched", label:"미확인",    emoji:"○", color:"#94a3b8", bg:"#f8fafc", accent:"#e2e8f0" },
  { key:"checked",   label:"확인 완료", emoji:"✓", color:"#16a34a", bg:"#f0fdf4", accent:"#22c55e" },
  { key:"issue",     label:"이슈",      emoji:"!",  color:"#dc2626", bg:"#fef2f2", accent:"#ef4444" },
  { key:"skip",      label:"확인 불가", emoji:"—",  color:"#9333ea", bg:"#faf5ff", accent:"#a855f7" },
];
const S = Object.fromEntries(STATUS_LIST.map(s=>[s.key,s]));

// ── 00. 스플래시 ──────────────────────────────────────────────────────────
const PAGE_SPLASH = {
  id: "splash",
  storageKey: "moin_checklist_splash_v1",
  label: "00. 스플래시(설치시)",
  figmaPageUrl: toUrl("5145:18433"),
  flow: ["앱 실행", "Splash", "국가선택", "금액 확인 (계산기 지원?)", "→ Y: 금액 확인", "→ N: 회원가입 인트로"],
  groups: [
    {
      id: "grp-splash", label: "스플래시(설치시)", nodeId: "5145:18433",
      desc: "설치 후 첫 오픈 시 진입하는 화면들. 플로우 순서대로 5개 케이스.",
      cases: [
        {
          id:"splash-01", nodeId:"5145:18657", name:"설치 후 첫 오픈인 경우",
          flow:"앱 첫 실행 시 자동 진입 (Splash 다음)",
          components:[
            "iOS 상태바",
            "앱 로고 아이콘 (지구 그래픽)",
            "메인 타이틀: '60개국 송금, 쉽고 빠르게 이용해보세요'",
            "서브타이틀: '365일 24시간 언제나 신청 가능!'",
            "혜택 목록 4개: 빠른 송금 속도 / 저렴한 수수료 / 검증된 안전성 / 실시간 고객 지원",
            "Floating CTA: '이미 계정이 있어요' 텍스트 버튼 (underline)",
            "Floating CTA: '시작하기' 메인 버튼 (Primary)",
            "홈 인디케이터",
          ], edgeCases:[],
        },
        {
          id:"splash-02", nodeId:"5145:18435", name:"금액 확인 (수수료 계산기)",
          flow:"설치 후 첫 오픈 → 국가선택 → 수수료 계산기 지원 통화인 경우",
          components:[
            "iOS 상태바 + 헤더",
            "페이지 타이틀: '금액 비교하기'",
            "서브텍스트: '눈금을 움직여 보내는 금액을 조절해보세요.'",
            "금액 슬라이더 (10만원 ~ 650만원) — ruler 눈금 포함",
            "보내는 금액 표시 (예: 1,000,000 원) — H1/Bold 32",
            "현재 환율 표시 (예: {100}{엔} = {907.8200}원)",
            "'실제 받는 금액' 레이블",
            "비교 테이블: 모인 — '👍 가장 많이 보내요' 뱃지 포함",
            "비교 테이블: 은행 평균 — 차액 표시 (빨간색 ▼)",
            "비교 테이블: 타사 송금 서비스 평균 — 차액 표시",
            "유학생 혜택 인포 배너 (회색 bg)",
            "수수료 안내 푸터 텍스트 (10px)",
            "하단 CTA: '송금 시작하기' 버튼",
            "홈 인디케이터",
          ],
          edgeCases:[
            { id:"ec-02-01", label:"계산기 불가 통화 (Nium 등) → 회원가입 인트로로 바로 점프",
              note:"피그마 Note 명시: '계산기 못 띄우는 경우, 곧바로 회원가입으로 점프 (ex. Nium)'" },
          ],

const _memCache = {};
let _supabaseOk = true;

async function _sbFetch(key, method, body) {
  try {
    const url = SUPABASE_URL + "/rest/v1/checklist";
    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": method === "POST" ? "resolution=merge-duplicates,return=minimal" : "return=minimal"
    };
    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url + (method === "GET" ? "?key=eq." + encodeURIComponent(key) + "&select=data" : ""), opts);
    if (!res.ok) throw new Error(await res.text());
    return method === "GET" ? await res.json() : null;
  } catch(e) {
    _supabaseOk = false;
    console.warn("Supabase error:", e);
    return null;
  }
}

function loadSt(key) {
  if (_memCache[key] !== undefined) return _memCache[key];
  try {
    const val = JSON.parse(localStorage.getItem(key) || "{}");
    _memCache[key] = val;
    return val;
  } catch { return {}; }
}

function saveSt(key, d) {
  _memCache[key] = d;
  try { localStorage.setItem(key, JSON.stringify(d)); } catch {}
  // Supabase 비동기 저장 (UI는 캐시로 즉시 반영)
  _sbFetch(key, "POST", { key, data: d, updated_at: new Date().toISOString() }).catch(() => {});
}

// 앱 시작 시 Supabase에서 전체 데이터 로드
async function syncFromSupabase() {
  try {
    const url = SUPABASE_URL + "/rest/v1/checklist?select=key,data";
    const res = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!res.ok) throw new Error(await res.text());
    const rows = await res.json();
    let hasData = false;
    for (const row of rows) {
      if (row.data && Object.keys(row.data).length > 0) {
        _memCache[row.key] = row.data;
        localStorage.setItem(row.key, JSON.stringify(row.data));
        hasData = true;
      }
    }
    return hasData;
  } catch(e) {
    console.warn("Supabase sync failed, using localStorage:", e);
    return false;
  }
}

function getAllCases(page) { return page.groups.flatMap(g=>g.cases); }

function countPage(page) {
  const st = loadSt(page.storageKey);
  const cases = getAllCases(page);
  const total = cases.length;
  const checked = cases.filter(c=>(st[c.id]?.status||"untouched")==="checked").length;
  const issues  = cases.filter(c=>(st[c.id]?.status||"untouched")==="issue").length;
  return { total, checked, issues };
}

function renderIndex() {
  try {
  const body = document.getElementById("idx-body");
  body.innerHTML = "";

  let totalAll=0, checkedAll=0, issueAll=0;

  const byGroup = {};
  INDEX_PAGES.forEach(p => {
    if (!byGroup[p.group]) byGroup[p.group] = [];
    byGroup[p.group].push(p);
  });

  for (const [gid, pages] of Object.entries(byGroup)) {
    const lbl = document.createElement("div");
    lbl.className = "section-label";
    lbl.textContent = GROUP_LABELS[gid];
    body.appendChild(lbl);

    const cards = document.createElement("div");
    cards.className = "idx-cards";

    for (const p of pages) {
      let checked=0, issues=0, total=0;
      if (p.page) {
        const c = countPage(p.page);
        total=c.total; checked=c.checked; issues=c.issues;
        totalAll+=total; checkedAll+=checked; issueAll+=issues;
      }

      const dot = p.page ? "dot-wip" : "dot-todo";
      let badge = "";
      if (!p.page) {
        badge = `<span class="ibadge ibadge-todo">미작성</span>`;
      } else {
        if (checked>0) badge += `<span class="ibadge ibadge-done">✓ ${checked}</span>`;
        if (issues>0)  badge += `<span class="ibadge ibadge-issue">! ${issues}</span>`;
        if (!checked && !issues) badge = `<span class="ibadge ibadge-wip">${total}개 케이스</span>`;
      }

      const card = document.createElement("div");
      card.className = "idx-card" + (p.page ? "" : " idx-disabled");
      card.innerHTML = `
        <div class="idx-dot ${dot}"></div>
        <span class="idx-num">${p.num}</span>
        <div class="idx-body">
          <div class="idx-name">${p.name}</div>
          ${p.note ? `<div class="idx-note">${p.note}</div>` : ""}
        </div>
        <div class="idx-right">
          ${badge}
          ${p.page ? `<span class="idx-arrow">›</span>` : ""}
        </div>`;
      if (p.page) card.addEventListener("click", () => showChecklist(p.page));
      cards.appendChild(card);
    }
    body.appendChild(cards);
  }

  // divider before admin
  const adminLbl = body.querySelector(".section-label:last-of-type");
  if (adminLbl) {
    const div = document.createElement("div");
    div.className = "divider";
    body.insertBefore(div, adminLbl);
  }

  const pct = totalAll > 0 ? Math.round(checkedAll/totalAll*100) : 0;
  document.getElementById("idx-prog-num").textContent = pct+"%";
  document.getElementById("idx-prog-pct").textContent = pct+"%";
  document.getElementById("idx-prog-bar").style.width = pct+"%";
  document.getElementById("idx-stat-done").textContent = `✓ ${checkedAll} 완료`;
  document.getElementById("idx-stat-issue").textContent = `! ${issueAll} 이슈`;
  document.getElementById("idx-stat-total").textContent = `총 ${totalAll}개`;
  document.getElementById("idx-footer-text").textContent = `피그마 검수 · ${INDEX_PAGES.filter(p=>p.page).length}/${INDEX_PAGES.length}페이지 작성`;

  const circ = document.getElementById("idx-prog-circle");
  const r = 21, circ2 = 2*Math.PI*r;
  circ.setAttribute("stroke-dashoffset", circ2*(1-pct/100));
  } catch(e) {
    console.error("renderIndex error:", e);
    document.getElementById("idx-body").innerHTML = "<div style=\'padding:20px;color:red\'>렌더링 오류: " + e.message + "</div>";
  }
}

        const ecNote = ecNotes[ec.id] || "";

  return card;

  d.textContent = text;
  return d;
}

function makeMemoArea(value, onSave, placeholder) {
  const box = document.createElement("div");
  box.className = "memo-box";
  if (value) {
    box.innerHTML = `<span style="font-size:11px;flex-shrink:0">📝</span><span class="memo-content">${escHtml(value)}</span>`;
    box.onclick = () => replaceWithEditor(box, value, onSave, placeholder);
  } else {
    box.innerHTML = `<span class="memo-placeholder">+ ${placeholder}</span>`;
    box.onclick = () => replaceWithEditor(box, "", onSave, placeholder);
  }
  return box;
}

function replaceWithEditor(el, initVal, onSave, placeholder) {
  const wrap = document.createElement("div");
  wrap.className = "edit-wrap";
  const ta = document.createElement("textarea");
  ta.value = initVal;
  ta.placeholder = placeholder + "...";
  ta.rows = 3;
  const btns = document.createElement("div");
  btns.className = "edit-btns";
  const save = document.createElement("button");
  save.className = "save-btn";
  save.textContent = "저장";
  save.onclick = () => onSave(ta.value);
  const cancel = document.createElement("button");
  cancel.className = "cancel-btn";
  cancel.textContent = "취소";
  cancel.onclick = () => renderChecklist();
  btns.appendChild(save);
  btns.appendChild(cancel);
  wrap.appendChild(ta);
  wrap.appendChild(btns);
  el.replaceWith(wrap);
  ta.focus();
}


// ── 필터 ─────────────────────────────────────────────────────────────
let _currentFilter = "all";

function applyFilter(filter) {
  _currentFilter = filter;

  // 칩 활성화
  document.querySelectorAll(".filter-chip").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.filter === filter);
  });

  const page = currentPage;
  if (!page) return;
  const st = loadSt(page.storageKey);

  let visible = 0, total = 0;
  document.querySelectorAll(".case-card[data-case-id]").forEach(card => {
    const cid = card.dataset.caseId;
    const status = st[cid]?.status || "untouched";
    total++;
    const show = filter === "all" || status === filter;
    card.classList.toggle("hidden", !show);
    if (show) visible++;
  });

  // 그룹 내 모든 케이스가 숨겨지면 그룹 숨기기
  document.querySelectorAll(".grp-wrap").forEach(grp => {
    const cards = grp.querySelectorAll(".case-card[data-case-id]");
    const anyVisible = [...cards].some(c => !c.classList.contains("hidden"));
    grp.classList.toggle("all-hidden", !anyVisible);
  });

  // 카운트 표시
  const countEl = document.getElementById("cl-filter-count");
  if (countEl) countEl.textContent = filter === "all" ? `${total}개` : `${visible} / ${total}개`;
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}
